<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaziFile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
        <h2 class="text-2xl font-bold text-blue-600">KaziFile</h2>
        <div class="space-x-4">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="text-gray-700 hover:text-blue-600">Dashboard</a>
                <a href="{% url 'upload' %}" class="text-gray-700 hover:text-blue-600">Upload</a>
                <a href="{% url 'logout' %}" class="text-red-500 hover:text-red-700">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="text-gray-700 hover:text-blue-600">Login</a>
                <a href="{% url 'signup' %}" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-10">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>

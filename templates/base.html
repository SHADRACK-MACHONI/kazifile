<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaziFile — Your Documents, Always Ready</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .heading-font { font-family: 'Space Grotesk', sans-serif; }

        html { scroll-behavior: smooth; }

        body {
            background: #050608;
            min-height: 100vh;
        }

        /* Ambient background orbs, subtle across all pages */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: drift 20s ease-in-out infinite alternate;
        }
        @keyframes drift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, -30px); }
        }

        /* Navbar */
        .nav-glass {
            background: rgba(5, 6, 8, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s ease;
        }
        .nav-glass.scrolled {
            background: rgba(5, 6, 8, 0.85);
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }

        .logo-mark {
            background: linear-gradient(135deg, #BB0000, #006600);
            box-shadow: 0 0 20px rgba(0,102,0,0.3);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .logo-mark:hover {
            transform: rotate(-8deg) scale(1.08);
        }

        .nav-link {
            position: relative;
            transition: color 0.2s ease;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            left: 0; bottom: -4px;
            width: 0; height: 2px;
            background: linear-gradient(90deg, #BB0000, #006600);
            transition: width 0.3s ease;
            border-radius: 999px;
        }
        .nav-link:hover::after { width: 100%; }

        .signup-glow {
            background: linear-gradient(135deg, #BB0000, #006600);
            box-shadow: 0 0 20px rgba(0,102,0,0.3), 0 0 30px rgba(187,0,0,0.2);
            transition: all 0.3s ease;
        }
        .signup-glow:hover {
            box-shadow: 0 0 30px rgba(0,102,0,0.5), 0 0 40px rgba(187,0,0,0.4);
            transform: translateY(-2px);
        }

        .avatar-ring {
            background: linear-gradient(135deg, #BB0000, #006600);
            padding: 2px;
        }

        .kenya-underline {
            background: linear-gradient(90deg, #000000 0%, #000000 25%, #BB0000 25%, #BB0000 50%, #ffffff 50%, #ffffff 75%, #006600 75%, #006600 100%);
            height: 2px;
        }

        /* Page fade-in on load */
        main {
            animation: pageIn 0.6s ease;
            position: relative;
            z-index: 1;
        }
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::selection { background: #006600; color: white; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050608; }
        ::-webkit-scrollbar-thumb { background: #2a2d33; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3d43; }
    </style>
</head>
<body class="text-white">

    <div class="bg-orb w-96 h-96 bg-red-600 top-0 -left-20"></div>
    <div class="bg-orb w-96 h-96 bg-green-600 top-1/2 -right-20" style="animation-delay: -8s;"></div>

    <nav class="nav-glass fixed top-0 w-full z-50" id="navbar">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'landing' %}{% endif %}" class="flex items-center gap-3 group">
                <div class="logo-mark w-10 h-10 rounded-xl flex items-center justify-center font-bold heading-font text-lg">K</div>
                <span class="text-xl font-bold heading-font">KaziFile</span>
            </a>

            <div class="flex items-center gap-8">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="nav-link text-gray-300 hover:text-white text-sm font-medium">Dashboard</a>
                    <a href="{% url 'upload' %}" class="nav-link text-gray-300 hover:text-white text-sm font-medium">Upload</a>
                    <a href="{% url 'profile' %}" class="nav-link text-gray-300 hover:text-white text-sm font-medium">Profile</a>

                    <div class="flex items-center gap-3 pl-4 border-l border-white/10">
                        <div class="avatar-ring w-9 h-9 rounded-full">
                            <div class="w-full h-full rounded-full bg-[#0d1117] flex items-center justify-center text-sm font-bold">
                                {{ user.username|first|upper }}
                            </div>
                        </div>
                        <a href="{% url 'logout' %}" class="text-gray-400 hover:text-red-400 text-sm font-medium transition">Logout</a>
                    </div>
                {% else %}
                    <a href="{% url 'login' %}" class="nav-link text-gray-300 hover:text-white text-sm font-medium">Login</a>
                    <a href="{% url 'signup' %}" class="signup-glow text-white px-5 py-2.5 rounded-full text-sm font-semibold">
                        Get Started
                    </a>
                {% endif %}
            </div>
        </div>
        <div class="kenya-underline"></div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 pt-28 pb-16 relative">
        {% block content %}
        {% endblock %}
    </main>

    <script>
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>

</body>
</html>

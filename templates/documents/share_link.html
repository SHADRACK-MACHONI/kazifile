{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-2xl shadow-lg text-center">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">✅ Share Link Created</h2>
    <p class="text-gray-600 mb-4">This link is valid for 2 days:</p>

    <div class="bg-gray-100 p-4 rounded-lg break-all text-sm text-blue-700 mb-6">
        {{ full_url }}
    </div>

    <div class="flex justify-center mb-6">
        <img src="{{ qr_code_data }}" alt="QR Code" class="w-48 h-48 border border-gray-200 rounded-lg" />
    </div>

    <p class="text-sm text-gray-500 mb-6">Scan this code to open the document directly on another device.</p>

    <a href="{% url 'dashboard' %}" class="text-blue-600 hover:underline">← Back to Dashboard</a>
</div>
{% endblock %}

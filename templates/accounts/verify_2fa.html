{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg text-center">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Enter Verification Code</h2>
    <p class="text-gray-600 mb-6">Open your authenticator app and enter the 6-digit code.</p>

    {% if error %}
        <p class="text-red-500 mb-4">{{ error }}</p>
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <input type="text" name="token" placeholder="6-digit code" maxlength="6"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
            Verify
        </button>
    </form>
</div>
{% endblock %}

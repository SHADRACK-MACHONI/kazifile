{% extends 'base.html' %}
{% block content %}
<style>
    .glass {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
</style>
<div class="max-w-md mx-auto px-4 text-white text-center">
    <div class="glass rounded-3xl p-10">
        <div class="text-5xl mb-4">📧</div>
        <h2 class="text-2xl font-bold mb-3" style="font-family:'Space Grotesk',sans-serif;">Verify your email</h2>
        <p class="text-gray-400 mb-2">We've sent a verification link to:</p>
        <p class="text-white font-medium mb-6">{{ email }}</p>
        <p class="text-gray-500 text-sm mb-6">Click the link in that email to activate your account, then log in.</p>
        <a href="{% url 'login' %}" class="text-emerald-400 hover:text-emerald-300 hover:underline">← Back to login</a>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<style>
    .glass {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
</style>
<div class="max-w-md mx-auto px-4 text-white text-center">
    <div class="glass rounded-3xl p-10">
        <div class="text-5xl mb-4">⚠️</div>
        <h2 class="text-2xl font-bold mb-3">Invalid link</h2>
        <p class="text-gray-400 mb-6">This verification link is invalid or has already been used.</p>
        <a href="{% url 'signup' %}" class="text-emerald-400 hover:text-emerald-300 hover:underline">Back to signup</a>
    </div>
</div>
{% endblock %}

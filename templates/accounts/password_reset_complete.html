{% extends 'base.html' %}
{% block content %}
<style>
    .glass {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-btn {
        background: linear-gradient(135deg, #BB0000, #006600);
        box-shadow: 0 0 20px rgba(0,102,0,0.25);
    }
</style>

<div class="max-w-md mx-auto px-4 text-white text-center">
    <div class="glass rounded-3xl p-10">
        <div class="text-5xl mb-4">✅</div>
        <h2 class="text-2xl font-bold mb-3" style="font-family:'Space Grotesk',sans-serif;">Password reset</h2>
        <p class="text-gray-400 mb-6">Your password has been changed successfully.</p>
        <a href="{% url 'login' %}" class="glow-btn inline-block text-white px-6 py-3 rounded-full font-semibold">
            Log In Now
        </a>
    </div>
</div>
{% endblock %}

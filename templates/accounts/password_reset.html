{% extends 'base.html' %}
{% block content %}
<style>
    .glass {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .field-input {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.1);
        transition: all 0.2s ease;
    }
    .field-input:focus {
        border-color: #006600;
        background: rgba(255,255,255,0.05);
        box-shadow: 0 0 0 4px rgba(0,102,0,0.1);
        outline: none;
    }
    .submit-btn {
        background: linear-gradient(135deg, #BB0000, #006600);
        box-shadow: 0 8px 24px rgba(0,102,0,0.25);
        transition: all 0.3s ease;
    }
    .submit-btn:hover {
        box-shadow: 0 8px 32px rgba(187,0,0,0.35);
        transform: translateY(-2px);
    }
</style>

<div class="max-w-md mx-auto px-4 text-white">
    <div class="glass rounded-3xl p-8">
        <h2 class="text-3xl font-bold mb-1" style="font-family:'Space Grotesk',sans-serif;">Reset your password</h2>
        <p class="text-gray-400 mb-6">Enter your email and we'll send you a link to reset it.</p>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <button type="submit" class="submit-btn w-full text-white py-3 rounded-full font-semibold mt-2">
                Send Reset Link
            </button>
        </form>

        <p class="text-sm text-gray-500 mt-6 text-center">
            <a href="{% url 'login' %}" class="text-emerald-400 hover:text-emerald-300 hover:underline">← Back to login</a>
        </p>
    </div>
</div>

<script>
    document.querySelectorAll('input[type="email"]').forEach(el => {
        el.classList.add('field-input', 'w-full', 'rounded-xl', 'px-4', 'py-3', 'text-white');
    });
</script>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg text-center">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Set Up Two-Factor Authentication</h2>
    <p class="text-gray-600 mb-6">Scan this code with Google Authenticator or Authy:</p>

    <div class="flex justify-center mb-6">
        <img src="{{ qr_code_data }}" alt="2FA QR Code" class="w-48 h-48 border border-gray-200 rounded-lg" />
    </div>

    {% if error %}
        <p class="text-red-500 mb-4">{{ error }}</p>
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <input type="text" name="token" placeholder="Enter 6-digit code" maxlength="6"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
            Verify & Activate
        </button>
    </form>

    <a href="{% url 'dashboard' %}" class="text-sm text-gray-400 hover:underline mt-4 inline-block">Skip for now</a>
</div>
{% endblock %}
